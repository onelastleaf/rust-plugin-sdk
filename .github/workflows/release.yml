name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test -n "$tag_commit"
          test "$head_commit" = "$tag_commit"
          git merge-base --is-ancestor "$head_commit" origin/main

          crate_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] |
                select(.name == "onelastleaf-plugin-sdk") |
                .version'
          )"
          test "$RELEASE_TAG" = "v$crate_version"
          grep -Fq "## [$crate_version]" CHANGELOG.md

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Verify package
        run: cargo publish --dry-run -p onelastleaf-plugin-sdk --locked

  publish:
    name: Publish crate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: crates.io
      url: https://crates.io/crates/onelastleaf-plugin-sdk
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish -p onelastleaf-plugin-sdk --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
