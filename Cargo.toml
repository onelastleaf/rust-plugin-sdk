[package]
name = "onelastleaf-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust SDK for onelastleaf process plugins"
repository = "https://github.com/onelastleaf/rust-plugin-sdk"
license = "GPL-3.0-only"
keywords = ["onelastleaf", "plugin", "grpc"]
categories = ["api-bindings", "asynchronous"]
include = ["build.rs", "proto/oll", "src", "README.md", "LICENSE"]

[workspace]
members = ["tests/fixtures/conformance-plugin"]
default-members = [".", "tests/fixtures/conformance-plugin"]
resolver = "3"

[dependencies]
http = "1.1"
prost = "0.14.1"
prost-types = "0.14.1"
sha2 = "0.11.0"
tokio = { version = "1.34", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.16", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
uuid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.149"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = { version = "0.14", default-features = false, features = ["cleanup-markdown"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["macros", "rt-multi-thread"] }
