[package]
name = "onelastleaf-plugin-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for onelastleaf process plugins"
repository = "https://github.com/onelastleaf/rust-plugin-sdk"
license = "GPL-3.0-only"
keywords = ["onelastleaf", "plugin", "grpc"]
categories = ["api-bindings", "asynchronous"]
include = ["build.rs", "examples", "proto/oll", "src", "README.md", "LICENSE"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
url = "2"
uuid = "1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
